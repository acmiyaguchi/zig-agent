repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: zig-fmt
        name: zig fmt
        entry: zig fmt --check
        language: system
        types: [file]
        files: \.zig$
        exclude: ^zig-cache/|^zig-out/|^vendor/
